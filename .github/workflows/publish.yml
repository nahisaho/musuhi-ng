# MUSUHI 2.0 - npm Publish Workflow
# Publishes packages to npm registry on version tags

name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags (e.g., v1.0.0)

  # Manual trigger
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Perform dry run (no actual publish)'
        required: false
        type: boolean
        default: true

jobs:
  # Job 1: Validate and Build
  validate-and-build:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linters
        run: pnpm lint
        continue-on-error: true

      - name: Run type check
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run E2E tests
        run: pnpm --filter @musuhi-ng/e2e-tests test

      - name: Security audit (production dependencies only)
        run: |
          pnpm audit --prod || {
            echo "❌ Critical security vulnerabilities found in production dependencies"
            echo "Please fix vulnerabilities before publishing"
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 7

  # Job 2: Publish to npm
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate-and-build
    permissions:
      contents: write # For creating GitHub releases
      id-token: write # For npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Dry run publish (if manual trigger with dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: |
          echo "🧪 Running dry-run publish..."
          pnpm publish -r --dry-run --no-git-checks
          echo "✅ Dry-run completed successfully"

      - name: Publish to npm (real publish)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "📦 Publishing packages to npm..."
          pnpm publish -r --no-git-checks --access public
          echo "✅ All packages published successfully!"

      - name: Extract version from tag
        if: github.event_name == 'push'
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Publishing version: $VERSION"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## MUSUHI 2.0 - Release ${{ steps.version.outputs.VERSION }}

            ### Published Packages

            All packages have been published to npm:

            - `@musuhi-ng/core@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/cli@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/dashboard@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/constitutional-governance@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/change-workflow@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/multi-agent-orchestrator@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/parallel-executor@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/gap-analyzer@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/iterative-verification@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/platform-adapters@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/verification-engine@${{ steps.version.outputs.VERSION }}`
            - `@musuhi-ng/security-audit-logger@${{ steps.version.outputs.VERSION }}`

            ### Installation

            ```bash
            # Install core framework
            npm install @musuhi-ng/core

            # Or install CLI
            npm install -g @musuhi-ng/cli
            ```

            ### Documentation

            See the [documentation](https://musuhi.github.io/musuhi2) for usage instructions.

            ### Changelog

            See [CHANGELOG.md](https://github.com/musuhi/musuhi2/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false

  # Job 3: Verify Publication
  verify-publication:
    name: Verify Publication
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)

    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="latest"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for npm propagation
        run: |
          echo "⏳ Waiting 30 seconds for npm to propagate packages..."
          sleep 30

      - name: Verify @musuhi-ng/core published
        run: |
          npm view @musuhi-ng/core@${{ steps.version.outputs.VERSION }} version || {
            echo "❌ @musuhi-ng/core not found on npm"
            exit 1
          }

      - name: Verify @musuhi-ng/cli published
        run: |
          npm view @musuhi-ng/cli@${{ steps.version.outputs.VERSION }} version || {
            echo "❌ @musuhi-ng/cli not found on npm"
            exit 1
          }

      - name: Test installation
        run: |
          echo "🧪 Testing package installation..."
          mkdir test-install
          cd test-install
          npm init -y
          npm install @musuhi-ng/core@${{ steps.version.outputs.VERSION }}
          echo "✅ Package installation successful!"

      - name: Notify success
        run: |
          echo "🎉 All packages successfully published and verified!"
          echo "📦 Version: ${{ steps.version.outputs.VERSION }}"
          echo "🔗 npm: https://www.npmjs.com/org/musuhi"
